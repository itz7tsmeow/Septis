<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>7TS</title>
  <link rel="icon" type="image/png" href="pack.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      color: #eee;
      overflow: hidden;
      background: #08060e;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Background ── */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-layer video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.3) saturate(0.6) hue-rotate(260deg);
    }

    /* Gradient overlay to unify the purple tone */
    .bg-layer::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 50% 45%, transparent 0%, #08060e 100%),
        linear-gradient(180deg, rgba(8,6,14,0.3) 0%, rgba(8,6,14,0.85) 100%);
      pointer-events: none;
    }

    /* Animated ambient orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 1;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .orb--1 {
      width: 480px; height: 480px;
      background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
      top: -10%; left: -8%;
      animation-duration: 20s;
    }
    .orb--2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #a855f7 0%, transparent 70%);
      bottom: -12%; right: -6%;
      animation-duration: 24s;
      animation-direction: alternate-reverse;
    }
    .orb--3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #6d28d9 0%, transparent 70%);
      top: 50%; left: 55%;
      animation-duration: 16s;
    }
    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(30px, -20px) scale(1.08); }
      100% { transform: translate(-20px, 15px) scale(0.95); }
    }

    /* ── Liquid Glass Card ── */
    .card {
      position: relative;
      z-index: 10;
      width: min(460px, 90vw);
      padding: 44px 36px 36px;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;

      /* Liquid glass */
      background: linear-gradient(
        135deg,
        rgba(147, 97, 255, 0.12) 0%,
        rgba(255, 255, 255, 0.05) 40%,
        rgba(147, 97, 255, 0.08) 100%
      );
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
      border: 1px solid rgba(168, 128, 255, 0.18);
      box-shadow:
        0 0 0 0.5px rgba(168, 128, 255, 0.10),
        0 2px 8px rgba(0, 0, 0, 0.4),
        0 16px 48px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -1px 0 rgba(0, 0, 0, 0.15);

      /* Subtle inner light refraction */
      overflow: hidden;
    }

    /* Top specular highlight — liquid glass refraction */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      border-radius: 28px 28px 0 0;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.07) 0%,
        transparent 100%
      );
      pointer-events: none;
    }

    /* ── Avatar ── */
    .avatar-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 8px;
    }

    .avatar-wrap::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #7c3aed, #a855f7, #c084fc, #a855f7, #7c3aed
      );
      animation: ring-spin 6s linear infinite;
      opacity: 0.7;
    }

    .avatar-wrap::after {
      content: '';
      position: absolute;
      inset: 1px;
      border-radius: 50%;
      background: #0c0a14;
    }

    @keyframes ring-spin {
      to { transform: rotate(360deg); }
    }

    .avatar {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    /* ── Typography ── */
    .username {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #e0d0ff 0%, #c084fc 50%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 0.85rem;
      font-weight: 400;
      color: rgba(200, 180, 240, 0.55);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    /* ── Divider ── */
    .divider {
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(168, 128, 255, 0.25), transparent);
      margin-bottom: 22px;
    }

    /* ── Social Links ── */
    .socials {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      color: rgba(220, 200, 255, 0.75);
      text-decoration: none;

      /* Mini liquid glass */
      background: linear-gradient(
        135deg,
        rgba(147, 97, 255, 0.10) 0%,
        rgba(255, 255, 255, 0.03) 100%
      );
      border: 1px solid rgba(168, 128, 255, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .social-link:hover {
      color: #d8b4fe;
      background: linear-gradient(
        135deg,
        rgba(147, 97, 255, 0.22) 0%,
        rgba(255, 255, 255, 0.06) 100%
      );
      border-color: rgba(168, 128, 255, 0.30);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.25);
    }

    .social-link svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card { padding: 36px 24px 28px; border-radius: 22px; }
      .username { font-size: 1.4rem; }
      .avatar-wrap { width: 80px; height: 80px; }
      .social-link { width: 40px; height: 40px; border-radius: 12px; }
      .social-link svg { width: 18px; height: 18px; }
    }
  </style>
</head>
