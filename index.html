  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #141414; font-family: 'Inter', sans-serif; color: #fff;
    }
    .bg-video-wrap {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #333;
    }
    .bg-video {
      width: 100%; height: 100%; object-fit: cover;
      filter: brightness(0.65) contrast(1.05);
    }
    .profile-card {
      position: relative; z-index: 10;
      width: min(540px, 92vw); padding: 32px 28px 26px; border-radius: 18px;
      background: rgba(120, 120, 120, 0.35);
      backdrop-filter: blur(18px) saturate(120%); -webkit-backdrop-filter: blur(18px) saturate(120%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin: auto;
    }
    .avatar-ring {
      position: relative; width: 104px; height: 104px; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center; margin-bottom: 12px;
    }
    .main-avatar {
      position: relative; z-index: 1; width: 102px; height: 102px; border-radius: 9999px; object-fit: cover;
    }
    .profile-title {
      font-size: 2.1rem; font-weight: 700; color: #fff; margin-bottom: 14px;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.5);
    }
    .social-row { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
    .social-icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; color: #fff; text-decoration: none;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.95));
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .social-icon-btn:hover {
      transform: translateY(-3px) scale(1.15);
      filter: drop-shadow(0 0 12px #fff) drop-shadow(0 0 24px #fff);
    }
    .audio-bar {
      position: fixed; top: 16px; left: 16px; z-index: 30;
      display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 16px;
      background: rgba(10, 10, 12, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>

  <script>
    const audio = document.getElementById('bgAudio');
    const video = document.getElementById('bgVideo');
    const muteBtn = document.getElementById('muteBtn');
    const vol = document.getElementById('volSlider');

    audio.volume = parseFloat(vol.value);
    video.play().catch(() => {});
    audio.play().catch(() => {
      // If browser blocks unmuted autoplay before first interaction, start on first click/touch/key anywhere
      const unlock = () => {
        audio.play().catch(() => {});
        video.play().catch(() => {});
        window.removeEventListener('click', unlock);
        window.removeEventListener('touchstart', unlock);
        window.removeEventListener('keydown', unlock);
      };
      window.addEventListener('click', unlock);
      window.addEventListener('touchstart', unlock);
      window.addEventListener('keydown', unlock);
    });

    muteBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.muted = false;
        audio.play().catch(() => {});
        muteBtn.textContent = '🔊';
      } else {
        audio.muted = !audio.muted;
        muteBtn.textContent = audio.muted ? '🔇' : '🔊';
      }
    });
    vol.addEventListener('input', (e) => {
      audio.volume = parseFloat(e.target.value);
      audio.muted = false;
      if (audio.paused) audio.play().catch(() => {});
      muteBtn.textContent = '🔊';
    });
  </script>
